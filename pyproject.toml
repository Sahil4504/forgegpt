[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgegpt"
version = "0.1.0"
description = "A GPT written from scratch, optimized for CPU inference, served on AWS."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sahil Manikshete" }]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "tokenizers",
    "tqdm",
]

[project.optional-dependencies]
# Model + training. On Kaggle, torch is already installed.
train = ["torch>=2.2", "onnx", "onnxruntime", "mlflow"]
# Serving: ONNX Runtime only (no torch), FastAPI app + web GUI.
serve = ["onnxruntime", "fastapi", "uvicorn[standard]"]
# Benchmarks and charts.
bench = ["matplotlib", "psutil", "locust", "tabulate", "requests"]
dev = ["pytest", "ruff", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/forgegpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "infra/cdk.out", "serving/lambda/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
