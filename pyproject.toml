[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgegpt"
version = "0.1.0"
description = "A GPT written from scratch, optimized for CPU inference, served on AWS."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sahil Manikshete" }]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "tokenizers",
    "tqdm",
]

[project.optional-dependencies]
# Model + training (Phase 2). On Kaggle, torch is already installed.
train = ["torch>=2.2", "mlflow"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/forgegpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
